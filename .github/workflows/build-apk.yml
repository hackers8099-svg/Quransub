name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f quran_caption.zip ]; then
            unzip -q quran_caption.zip -d unpacked
            cp -r unpacked/quran_caption/. .
            rm -rf unpacked
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name quran_caption --platforms=android .
          fi

      - name: Add INTERNET permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"
          fi
          grep -n "INTERNET" "$MANIFEST"

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: quran-caption-apk
          path: build/app/outputs/flutter-apk/app-release.apk
