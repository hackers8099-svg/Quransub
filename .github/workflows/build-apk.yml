name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Zip-ka wuu furayaa, kadibna faylasha folder-ka gudihiisa ayuu root-ka ku keenayaa
      - name: Unzip project
        run: |
          if [ -f quran_caption.zip ]; then
            unzip -q quran_caption.zip -d unpacked
            cp -r unpacked/quran_caption/. .
            rm -rf unpacked
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --project-name quran_caption --platforms=android .
          fi

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: quran-caption-apk
          path: build/app/outputs/flutter-apk/app-release.apk
